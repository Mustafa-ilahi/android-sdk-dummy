plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'maven-publish'
    id 'signing'
}

android {
    namespace 'com.alterna.sdk'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.4'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.4'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Generate sources JAR
task sourcesJar(type: Jar) {
    from android.sourceSets.main.java.srcDirs
    archiveClassifier.set('sources')
}

// Generate javadoc JAR
task javadocJar(type: Jar) {
    archiveClassifier.set('javadoc')
    // For Android libraries, we'll create a simple javadoc JAR with source files
    // In a real scenario, you might want to generate actual javadoc
    from android.sourceSets.main.java.srcDirs
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'io.github.mustafa-ilahi'
                artifactId = 'sdk'
                version = '1.0.0'

                // Add sources and javadoc JARs
                artifact sourcesJar
                artifact javadocJar

                pom {
                    name.set("Alterna SDK")
                    description.set("Android SDK for Alterna platform integration")
                    url.set("https://github.com/mustafa-ilahi/android-sdk")

                    licenses {
                        license {
                            name.set("The Apache License, Version 2.0")
                            url.set("http://www.apache.org/licenses/LICENSE-2.0.txt")
                        }
                    }

                    developers {
                        developer {
                            id.set("mustafa-ilahi")
                            name.set("Mustafa Ilahi")
                            email.set("mustafa@example.com")
                        }
                    }

                    scm {
                        connection.set("scm:git:git://github.com/mustafa-ilahi/android-sdk.git")
                        developerConnection.set("scm:git:ssh://github.com/mustafa-ilahi/android-sdk.git")
                        url.set("https://github.com/mustafa-ilahi/android-sdk")
                    }
                }
            }
        }
    }

    signing {
        // Configure GPG signing for Maven Central
        def signingKeyId = project.findProperty("signing.keyId")
        def signingKey = project.findProperty("signing.secretKeyRingFile")
        def signingPassword = project.findProperty("signing.password")
        
        if (signingKeyId && signingKey && signingPassword) {
            sign publishing.publications.release
        }
    }
}
